[project]
name = "trackmyproduct-daemon"
version = "0.1.0"
description = "Local daemon for TrackMyProduct: vault-backed product tracking, marketplace scanning, and notifications."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "PyYAML==6.0.2",
    "httpx==0.28.1",
    "APScheduler==3.11.0",
    "beautifulsoup4==4.12.3",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[project.scripts]
trackmyproduct-daemon = "trackmyproduct_daemon.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
